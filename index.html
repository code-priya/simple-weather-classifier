<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Weather Classifier</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Simple Weather Classifier</h1>
    <p>Enter basic readings and click <strong>Predict</strong>.</p>

    <form id="weather-form">
      <label>Temperature (°C)<input type="number" step="0.1" name="temperature" value="22"></label>
      <label>Humidity (% )<input type="number" step="0.1" name="humidity" value="55"></label>
      <label>Pressure (hPa)<input type="number" step="0.1" name="pressure" value="1012"></label>
      <label>Wind speed (m/s)<input type="number" step="0.1" name="wind_speed" value="3"></label>
      <button type="submit">Predict</button>
    </form>

    <div id="result" class="result" aria-live="polite"></div>
    <div class="note"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
